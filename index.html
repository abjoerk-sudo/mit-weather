<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MIT_B Weather Station</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #15202b;
      --muted: #667085;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 18px 60px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; }
    h1 { margin:0 0 6px; font-size:clamp(28px,5vw,48px); letter-spacing:-0.03em; }
    .subtitle { color:var(--muted); }
    .status {
      background:var(--card); border:1px solid var(--line);
      border-radius:999px; padding:10px 14px; font-weight:700; white-space:nowrap;
    }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#9ca3af; margin-right:8px; }
    .grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:14px;
    }
    .card {
      background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px;
      box-shadow:0 1px 2px rgba(0,0,0,.03);
    }
    .metric-label { color:var(--muted); font-size:14px; margin-bottom:8px; }
    .metric-value { font-size:31px; font-weight:750; letter-spacing:-.03em; }
    .metric-unit { font-size:15px; color:var(--muted); margin-left:3px; }
    .wide { grid-column:1 / -1; }
    .chart { height:320px; }
    .meta { color:var(--muted); font-size:14px; line-height:1.55; }
    .fresh { background:#16a34a; }
    .delayed { background:#f59e0b; }
    .offline { background:#dc2626; }
    @media (max-width:800px){ .grid{grid-template-columns:repeat(2,1fr)} header{flex-direction:column} }
    @media (max-width:480px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>MIT_B Weather Station</h1>
      <div class="subtitle">Hourly observations · GEUS / PROMICE</div>
    </div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Loading…</span></div>
  </header>

  <div class="grid">
    <div class="card"><div class="metric-label">Air temperature</div><div class="metric-value"><span id="temperature">—</span><span class="metric-unit">°C</span></div></div>
    <div class="card"><div class="metric-label">Wind speed</div><div class="metric-value"><span id="wind">—</span><span class="metric-unit">m/s</span></div></div>
    <div class="card"><div class="metric-label">Relative humidity</div><div class="metric-value"><span id="humidity">—</span><span class="metric-unit">%</span></div></div>
    <div class="card"><div class="metric-label">Air pressure</div><div class="metric-value"><span id="pressure">—</span><span class="metric-unit">hPa</span></div></div>

    <div class="card wide"><div id="tempChart" class="chart"></div></div>
    <div class="card wide"><div id="windChart" class="chart"></div></div>

    <div class="card wide meta">
      <strong>Latest observation:</strong> <span id="latestTime">—</span><br>
      <strong>Dashboard data generated:</strong> <span id="generatedTime">—</span><br>
      <strong>Station:</strong> MIT_B · approx. 65.7061° N, 37.8114° W · 520 m a.s.l.<br>
      <strong>Source:</strong> GEUS / PROMICE hourly Level-3 data
    </div>
  </div>
</div>

<script>
const fmt = (v, digits=1) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(digits);

function updateStatus(timestamp) {
  const ageHours = (Date.now() - new Date(timestamp).getTime()) / 3600000;
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");

  dot.className = "dot";
  if (ageHours <= 3) {
    dot.classList.add("fresh");
    text.textContent = "LIVE";
  } else if (ageHours <= 12) {
    dot.classList.add("delayed");
    text.textContent = "DELAYED";
  } else {
    dot.classList.add("offline");
    text.textContent = "NO RECENT DATA";
  }
}

async function loadWeather() {
  // Cache-busting lets the browser see newly generated weather.json.
  const res = await fetch("weather.json?t=" + Date.now(), {cache: "no-store"});
  if (!res.ok) throw new Error("Could not load weather.json");
  const data = await res.json();

  document.getElementById("temperature").textContent = fmt(data.latest.temperature);
  document.getElementById("wind").textContent = fmt(data.latest.wind_speed);
  document.getElementById("humidity").textContent = fmt(data.latest.humidity, 0);
  document.getElementById("pressure").textContent = fmt(data.latest.pressure, 0);
  document.getElementById("latestTime").textContent = new Date(data.latest.time).toLocaleString();
  document.getElementById("generatedTime").textContent = new Date(data.generated_at).toLocaleString();
  updateStatus(data.latest.time);

  const x = data.history.map(d => d.time);

  const plotConfig = {responsive:true, displaylogo:false};

  Plotly.react("tempChart", [{
    x,
    y: data.history.map(d => d.temperature),
    type: "scatter",
    mode: "lines",
    name: "Air temperature"
  }], {
    title: {text:"Air temperature · last 7 days", x:0.02},
    margin:{l:60,r:20,t:55,b:45},
    xaxis:{title:"UTC"},
    yaxis:{title:"°C"},
    paper_bgcolor:"rgba(0,0,0,0)",
    plot_bgcolor:"rgba(0,0,0,0)"
  }, plotConfig);

  Plotly.react("windChart", [{
    x,
    y: data.history.map(d => d.wind_speed),
    type: "scatter",
    mode: "lines",
    name: "Wind speed"
  }], {
    title:{text:"Wind speed · last 7 days", x:0.02},
    margin:{l:60,r:20,t:55,b:45},
    xaxis:{title:"UTC"},
    yaxis:{title:"m/s", rangemode:"tozero"},
    paper_bgcolor:"rgba(0,0,0,0)",
    plot_bgcolor:"rgba(0,0,0,0)"
  }, plotConfig);
}

loadWeather().catch(err => {
  console.error(err);
  document.getElementById("statusText").textContent = "DATA ERROR";
});

// Refresh browser view every 5 minutes.
setInterval(() => loadWeather().catch(console.error), 5 * 60 * 1000);
</script>
</body>
</html>
